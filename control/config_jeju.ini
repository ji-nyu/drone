[db]
hostname = drone-proxy.npty.xyz
database = drone_jeju
username = drone
password = drone1234!! 

[session]
# true이면 DB에서 읽은 드론 중 drone_id가 아래 drone_id_list에 있는 것만 레지스트리에 남긴다.
filter_drones_by_list = false
# 쉼표로 구분. 공백은 앞뒤 trim. 예: TT-01,jeju-TT-01
drone_id_list =

[video]
# true이면 드론 자동 연결 직후 공통 비디오 설정 적용
enabled = true
# resolution: 480p | 720p
resolution = 480p
# fps: 5 | 15 | 30
fps = 5
# bitrate: auto | 1 | 2 | 3 | 4 | 5 (Mbps)
bitrate = auto
# direction: forward | downward
direction = forward
# snapshot 프레임이 오래 고정되면 frame reader를 자동 재시작
stale_restart = true
# 동일 프레임으로 판단하는 최소 시간(초)
stale_restart_sec = 2.0

[telemetry]
# true이면 연결된 드론 상태를 drone_telemetry 테이블에 주기적으로 insert
enabled = true
# 저장 주기(초)
interval_sec = 1

[mission]
# mission_start 실행 중 action 호출 결과가 locked면 재시도
retry_on_lock = true
lock_retry_interval_sec = 0.5
lock_retry_max_attempts = 20
# 액션 한 건 성공 직후, 다음 액션 전 대기(초). 타입별 키 생략 시 코드 기본값 사용. 최대 5초로 잘림.
delay_after_takeoff_sec = 1.0
delay_after_land_sec = 0.35
delay_after_stream_on_sec = 0.2
delay_after_default_sec = 0.2
